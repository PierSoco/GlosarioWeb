<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zatmeni - Glosario Técnico Inglés-Español</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 20% 30%, #0a0a0a, #020202 80%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    
.logo-hero{
  position: relative;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  font-size: 24px;
  font-weight: bold;
  padding: 0 20px;
  scale: 200%;
  animation: inicio 2s ease-in-out;
  transition: transform 0.3s ease;
}
.logo-zatmeni{
  position: relative;
  align-items: center;
  animation: logo 5s ease-in-out;
}
@keyframes logo {
  0%{
    scale: 0.2;
    left: 15%;
    transform: translateX(-50);
    transform: translateY(-400%);
  }
  50%{
    scale: 1;
    transform: translateY(0%);
    left: 15%;
    transform: translateX(-50);
  }
  80%{
    left: 0%;
  }
}
.nombre-zatmeni{
  position: relative;
  left: 0;
  top: 0;
  overflow: hidden;
  z-index: -10;
  width: 0%;
  height: 100%;
  animation: nombre 4s linear;
  animation-fill-mode: forwards;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
}
@keyframes nombre {
  50%{
    width: 0%;
  }
  100%{
    width: 100%;
  }
}
.logo {
  text-decoration: none;
  color: white;
  font-size: 20px;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 25px;
  transition: transform 0.3s ease;
}

.logo:hover {
  transform: scale(1.1);
}

.planet{
  position: relative;
  width: 30px;
  height: 30px;
  background-color: white;
  border-radius: 50%;
  box-shadow: 
      0 0 5px 0 #fed84c80,
      0 0 20px 4px #e8a55233;
  position: relative;
  z-index: 2;
}
.satelite, .satelite::after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
}
.satelite {
  position: relative;
  z-index: 1;
  background-color: #ffedd1;
  box-shadow: -2px 0 5px -1px white;
  overflow: hidden;
  animation: round-atras 5s infinite ease-in-out;
  scale: 200%;
}
.satelite::after {
  background-color: #262938;
  width: 2.5px;
  left: 2.5px;
  box-shadow: 0 0 0.75px 0.95px #262938;
  animation: shadow 5s infinite ease-in-out;
}
.satelite:nth-child(3){
  z-index: 10;
  animation: round 5s infinite ease-in-out;
}
@keyframes shadow {
  0% {
    width: 2.5px;
    left: 0;
  }
  25% {
    width: 5px;
    left: 0;
  }
  50% {
    width: 2.5px;
    left: 2.5px;
  }
  75% {
    width: 0px;
    left: 5px;
  }
  80% {
    left: 0;
    box-shadow: 0 0 0.55px 0.75px #262938;
  }
  100% {
    width: 2.5px;
    left: 0;
  }
}
@keyframes round {
  0%, 
  100% {
    top: -35px;
    left: -15px;
    opacity: 0;
    box-shadow: -2px 0 5px 0.5px #c6836466;
  }
  15%{
    opacity: 1;
  }
  20%{
    opacity: 1;
  }
  25% {
    opacity: 1;
    box-shadow: 0 0 3px 1px #412104b5;
  }
  45% {
    opacity: 1;
  }
  50% {
    top: 0px;
    left: 35px;
    opacity: 0;
    box-shadow: 2px 0 5px 0.5px #845e4682;
  }
  68% {
    opacity: 0;
  }
  75% {
    opacity: 0;
    box-shadow: 0 0 3px 1px black;
  }
  83% {
    opacity: 0;
  }
}
@keyframes round-atras {
  0%, 
  100% {
    top: 0px;
    left: -15px;
    box-shadow: -2px 0 5px 0.5px #c6836466;
  }
  25% {
    box-shadow: 0 0 3px 1px #412104b5;
  }
  50% {
   top: 35px;
   left: 35px;
    box-shadow: 2px 0 5px 0.5px #845e4682;
  }
   75% {
    box-shadow: 0 0 3px 1px black;
  }
}
  </style>
</head>
<body>
    <a href="zatmeni.ar" class="logo">
        <div class="planet">
            <div class="satelite"></div>
        </div>
        <h4>Zatmeni</h4>
    </a>
</body>
</html>
